services:
  api:
    build: .
    container_name: testesunitarios_api
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/alunos_db?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  db:
    image: postgres:16
    container_name: testesunitarios_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alunos_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d alunos_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge